name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build (Development)
        run: npm run build:dev

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Add coverage summary to job summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          npx vitest run --coverage --reporter=json-summary
          # Assuming vitest-coverage-report-action could be used here but let's stick to basics
          # For now, let the user know the artifact is available
          echo "Coverage report uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload coverage reports to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()
