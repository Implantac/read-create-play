name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.js', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'package.json', 'eslint.config.js', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-lint-

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Cache Vitest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vitest
            node_modules/.vite
          key: ${{ runner.os }}-test-${{ hashFiles('package-lock.json', 'package.json', 'vitest.config.ts', 'vite.config.ts', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ hashFiles('package-lock.json', 'package.json', 'vitest.config.ts', 'vite.config.ts', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-test-

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Add coverage summary to job summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          npx vitest run --coverage --reporter=json-summary
          echo "Coverage report uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        if: always()

      - name: Upload coverage reports to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        if: always()

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'package.json', 'src/**', 'public/**', 'vite.config.ts', 'tsconfig.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('package-lock.json', 'package.json', 'src/**', 'public/**', 'vite.config.ts', 'tsconfig.json', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-build-

      - name: Build (Development)
        run: npm run build:dev
